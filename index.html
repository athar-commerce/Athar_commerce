<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athar Commerce | أثر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --text-main: #ffffff;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 4rem;
        }

        /* Glassmorphism Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent);
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 7rem auto 2rem;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            grid-auto-flow: dense;
        }

        /* Media Cards styling */
        .media-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(56, 189, 248, 0.3);
            z-index: 2;
        }

        .media-card img, 
        .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .media-card:hover img,
        .media-card:hover video {
            transform: scale(1.04);
        }

        /* Layout Management for Aspect Ratios */
        .landscape {
            grid-column: span 2;
            aspect-ratio: 16 / 9;
        }
        
        .portrait {
            grid-column: span 1;
            aspect-ratio: 9 / 16;
        }

        .standard-img {
            grid-column: span 1;
            aspect-ratio: 4 / 3;
        }

        /* Responsive Design Adjustments */
        @media (max-width: 900px) {
            .landscape {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            Athar <span>Commerce</span> | <span style="font-family: 'Cairo', sans-serif;">أثر</span>
        </a>
    </header>

    <main class="gallery-container">
        
        <!-- Ordered Images 1 to 6 -->
        <div class="media-card standard-img">
            <img src="Image1.jpg" alt="Athar Commerce Project 1" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image2.jpg" alt="Athar Commerce Project 2" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image3.jpg" alt="Athar Commerce Project 3" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image4.jpg" alt="Athar Commerce Project 4" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image5.jpg" alt="Athar Commerce Project 5" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image6.jpg" alt="Athar Commerce Project 6" loading="lazy">
        </div>

        <!-- Ordered Videos -->
        <div class="media-card landscape">
            <video src="PC1.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="media-card portrait">
            <video src="Phone2.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="media-card landscape">
            <video src="PC3.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="media-card portrait">
            <video src="Phone3.mp4" autoplay loop muted playsinline></video>
        </div>

    </main>

    <script>
        // Optimization: Intersection Observer for videos so they only play when visible
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('video');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(e => console.log("Autoplay blocked:", e));
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.2 });

            videos.forEach(video => {
                observer.observe(video);
                
                // Double-click to fullscreen video
                video.addEventListener('dblclick', () => {
                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    } else if (video.webkitRequestFullscreen) {
                        video.webkitRequestFullscreen();
                    }
                });
            });
        });
    </script>
</body>
</html>
