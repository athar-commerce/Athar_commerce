<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athar Commerce | أثر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 4rem;
        }

        /* Glassmorphism Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 1.2rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 9rem 2rem 4rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto 2rem;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            grid-auto-flow: dense;
        }

        /* Media Cards styling */
        .media-card {
            background-color: var(--card-bg);
            border-radius: 4px; /* Sharper corners to prevent hiding image details */
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-color: rgba(56, 189, 248, 0.3);
            z-index: 2;
        }

        .media-card img, 
        .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Layout Management for Aspect Ratios */
        .landscape {
            grid-column: span 2;
            aspect-ratio: 16 / 9;
        }
        
        .portrait {
            grid-column: span 1;
            aspect-ratio: 9 / 16;
        }

        .standard-img {
            grid-column: span 1;
            aspect-ratio: 4 / 3;
        }

        /* Responsive Design Adjustments */
        @media (max-width: 900px) {
            .landscape {
                grid-column: span 1;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            Athar <span>Commerce</span> | <span style="font-family: 'Cairo', sans-serif;">أثر</span>
        </a>
    </header>

    <section class="hero">
        <h1>Transforming Clicks into Loyal Customers</h1>
        <p>At Athar Commerce, we specialize in crafting high-converting e-commerce experiences. We design strategic, visually stunning websites tailored to drive sales, optimize user journeys, and scale your brand's digital presence.</p>
    </section>

    <main class="gallery-container">
        
        <!-- Standard Desktop/Horizontal Images -->
        <div class="media-card standard-img">
            <img src="Image1.jpg" alt="Athar Commerce Project 1" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image2.jpg" alt="Athar Commerce Project 2" loading="lazy">
        </div>
        <div class="media-card standard-img">
            <img src="Image3.jpg" alt="Athar Commerce Project 3" loading="lazy">
        </div>

        <!-- Vertical Phone Images -->
        <div class="media-card portrait">
            <img src="Image4.jpg" alt="Athar Commerce Mobile Project 4" loading="lazy">
        </div>
        <div class="media-card portrait">
            <img src="Image5.jpg" alt="Athar Commerce Mobile Project 5" loading="lazy">
        </div>
        <div class="media-card portrait">
            <img src="Image6.jpg" alt="Athar Commerce Mobile Project 6" loading="lazy">
        </div>

        <!-- Ordered Videos -->
        <div class="media-card landscape">
            <video src="PC1.mp4" autoplay loop muted playsinline controls></video>
        </div>
        <div class="media-card portrait">
            <video src="Phone2.mp4" autoplay loop muted playsinline controls></video>
        </div>
        <div class="media-card landscape">
            <video src="PC3.mp4" autoplay loop muted playsinline controls></video>
        </div>
        <div class="media-card portrait">
            <video src="Phone3.mp4" autoplay loop muted playsinline controls></video>
        </div>

    </main>

</body>
</html>
